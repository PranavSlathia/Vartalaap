<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vartalaap Voice Bot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px 0;
        }
        header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        header p {
            color: #888;
            font-size: 14px;
        }

        /* Session stats bar */
        .session-stats {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #666;
            font-family: monospace;
            margin-top: 10px;
        }
        .stat-sep { color: #3a3a59; }

        .chat-container {
            background: #1e1e30;
            border-radius: 16px;
            padding: 20px;
            min-height: 350px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .tts-controls {
            background: #1e1e30;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid #2f2f49;
        }
        .tts-controls h3 {
            font-size: 14px;
            margin-bottom: 8px;
        }
        .tts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .tts-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .tts-field label {
            font-size: 11px;
            color: #8d8daa;
        }
        .tts-field select,
        .tts-field input {
            height: 34px;
            border-radius: 8px;
            border: 1px solid #3a3a59;
            background: #262640;
            color: #f4f4ff;
            padding: 0 10px;
            font-size: 13px;
        }
        .tts-note {
            margin-top: 8px;
            font-size: 11px;
            color: #9a9aba;
        }
        .message {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }
        .message.user { align-items: flex-end; }
        .message.bot { align-items: flex-start; }
        .message-content {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
        }
        .message.user .message-content {
            background: #4f46e5;
            border-bottom-right-radius: 4px;
        }
        .message.bot .message-content {
            background: #2d2d44;
            border-bottom-left-radius: 4px;
        }
        .message-meta {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }

        /* Language badge on user messages */
        .lang-badge {
            display: inline-block;
            font-size: 10px;
            font-family: monospace;
            background: #2d2d44;
            color: #8d8daa;
            border-radius: 3px;
            padding: 1px 5px;
            margin-right: 6px;
            vertical-align: middle;
        }

        /* Per-turn metrics row below bot messages */
        .metrics-row {
            font-size: 10px;
            font-family: monospace;
            color: #484860;
            margin-top: 4px;
            padding-left: 4px;
            max-width: 85%;
        }

        /* Voice indicator */
        .voice-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }
        .orb {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        .orb-inner {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            line-height: 1.3;
            transition: all 0.3s ease;
        }

        /* States */
        .orb.idle { background: #374151; }
        .orb.idle .orb-inner { background: #4b5563; }

        .orb.listening {
            background: #22c55e;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.5);
            animation: pulse-green 1.5s infinite;
        }
        .orb.listening .orb-inner { background: #16a34a; }

        .orb.processing {
            background: #f59e0b;
            animation: pulse-yellow 1s infinite;
        }
        .orb.processing .orb-inner { background: #d97706; }

        .orb.speaking {
            background: #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
            animation: pulse-blue 0.8s infinite;
        }
        .orb.speaking .orb-inner { background: #2563eb; }

        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 40px rgba(34, 197, 94, 0.6); transform: scale(1.02); }
        }
        @keyframes pulse-yellow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        @keyframes pulse-blue {
            0%, 100% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
            50% { box-shadow: 0 0 40px rgba(59, 130, 246, 0.6); }
        }

        .status-text {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
            text-align: center;
        }
        .status-text.active { color: #22c55e; }
        .status-text.error { color: #ef4444; }

        /* Volume visualization */
        .volume-bars {
            display: flex;
            gap: 3px;
            height: 30px;
            align-items: flex-end;
            margin-top: 15px;
        }
        .volume-bar {
            width: 4px;
            background: #22c55e;
            border-radius: 2px;
            transition: height 0.05s ease;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .btn {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #4f46e5;
            color: white;
        }
        .btn-primary:hover { background: #4338ca; }
        .btn-primary:disabled { background: #666; cursor: not-allowed; }
        .btn-secondary {
            background: #374151;
            color: white;
        }
        .btn-secondary:hover { background: #4b5563; }

        @media (max-width: 640px) {
            .tts-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Hidden audio player */
        #audioPlayer { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="businessTitle">Vartalaap Voice Bot</h1>
            <p>Voice Assistant - Hands-free conversation</p>
            <!-- Session stats: Turn N • M:SS • HI/EN -->
            <div id="sessionStats" class="session-stats" style="display:none;">
                <span id="statTurns">Turn 0</span>
                <span class="stat-sep">•</span>
                <span id="statTime">0:00</span>
                <span class="stat-sep">•</span>
                <span id="statLang">—</span>
            </div>
        </header>

        <div class="tts-controls">
            <h3>Settings</h3>
            <div class="tts-grid">
                <div class="tts-field">
                    <label>Voice Engine</label>
                    <div style="height:34px;border-radius:8px;border:1px solid #3a3a59;background:#262640;color:#f4f4ff;padding:0 10px;font-size:13px;display:flex;align-items:center;">Cartesia Sonic</div>
                </div>
                <div class="tts-field">
                    <label for="responseModeSelect">Reply Mode</label>
                    <select id="responseModeSelect">
                        <option value="echo">Fast Echo</option>
                        <option value="agent">Full Assistant (Slower)</option>
                    </select>
                </div>
            </div>
            <p class="tts-note">Cartesia Sonic with auto language detection (Hindi/English).</p>
        </div>

        <div class="chat-container" id="chat"></div>

        <div class="voice-indicator">
            <div class="orb idle" id="orb" onclick="handleOrbClick()">
                <div class="orb-inner" id="orbText">Click to<br>Start</div>
            </div>
            <div class="volume-bars" id="volumeBars" style="display: none;">
                <div class="volume-bar" style="height: 5px;"></div>
                <div class="volume-bar" style="height: 5px;"></div>
                <div class="volume-bar" style="height: 5px;"></div>
                <div class="volume-bar" style="height: 5px;"></div>
                <div class="volume-bar" style="height: 5px;"></div>
                <div class="volume-bar" style="height: 5px;"></div>
                <div class="volume-bar" style="height: 5px;"></div>
                <div class="volume-bar" style="height: 5px;"></div>
            </div>
            <div class="status-text" id="status">Click to start conversation</div>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" onclick="resetConversation()">Reset</button>
            <button class="btn btn-primary" id="toggleBtn" onclick="toggleConversation()">Start Call</button>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // Business ID from URL params (default: himalayan_kitchen)
        const businessId = new URLSearchParams(window.location.search).get('business_id') ?? 'himalayan_kitchen';

        // State
        let isActive = false;
        let isListening = false;
        let isProcessing = false;
        let isSpeaking = false;
        // Bug fix: crypto.randomUUID() instead of Date.now() — no collisions, not guessable
        let sessionId = crypto.randomUUID();

        // Race condition guard — monotonic counter; stale responses are discarded
        let currentRequestId = 0;

        // Session stats tracking
        let turnCount = 0;
        let sessionStartTime = null;
        let statsTimer = null;
        const langCounts = { hi: 0, en: 0 };

        // Audio
        let mediaRecorder;
        let audioChunks = [];
        let audioContext;
        let analyser;
        let mediaStream;
        let silenceTimer;
        let hasSpoken = false;

        // Settings
        const SILENCE_THRESHOLD = 0.015;
        const SILENCE_DURATION = 1200;  // 1.2 seconds
        const MIN_SPEECH_TIME = 300;

        // Elements
        const orb = document.getElementById('orb');
        const orbText = document.getElementById('orbText');
        const status = document.getElementById('status');
        const chat = document.getElementById('chat');
        const volumeBars = document.getElementById('volumeBars');
        const toggleBtn = document.getElementById('toggleBtn');
        const audioPlayer = document.getElementById('audioPlayer');
        const bars = volumeBars.querySelectorAll('.volume-bar');
        const responseModeSelect = document.getElementById('responseModeSelect');

        // Bug fix 1: sendBeacon on tab close/kill — fires even when page is killed
        // (pagehide fires reliably; unload/beforeunload do not on mobile/modern browsers)
        window.addEventListener('pagehide', () => {
            if (sessionId && isActive) {
                const payload = JSON.stringify({ session_id: sessionId });
                navigator.sendBeacon(
                    '/api/voice/end-session',
                    new Blob([payload], { type: 'application/json' })
                );
            }
        });

        // Also stop cleanly when tab goes to background
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && isActive) {
                stopConversation();
            }
        });

        function getMicErrorDetails(err) {
            const name = err?.name || 'UnknownError';
            const message = err?.message || String(err || '');
            const inIframe = window.self !== window.top;

            if (name === 'NotAllowedError' || name === 'SecurityError') {
                if (inIframe) {
                    return `Microphone blocked (${name}). This usually happens when iframe mic permission is not delegated. Open /voice directly in a new tab and allow microphone.`;
                }
                return `Microphone blocked (${name}). Allow mic in browser site settings for this origin, then reload.`;
            }

            if (name === 'NotFoundError') {
                return 'No microphone found. Connect a mic and retry.';
            }

            if (name === 'NotReadableError') {
                return 'Microphone is busy in another app/tab. Close other apps and retry.';
            }

            if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                return 'Microphone requires HTTPS on non-localhost origins.';
            }

            return `Microphone error (${name}): ${message}`;
        }

        async function fetchJsonWithRetry(url, options, retries = 1) {
            let lastError = null;

            for (let attempt = 0; attempt <= retries; attempt++) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 45000);

                try {
                    const response = await fetch(url, {
                        ...options,
                        signal: controller.signal,
                    });
                    clearTimeout(timeout);

                    const data = await response.json();
                    if (!response.ok) {
                        const serverMessage = data?.error || `HTTP ${response.status}`;
                        throw new Error(serverMessage);
                    }
                    return data;
                } catch (err) {
                    clearTimeout(timeout);
                    lastError = err;
                    if (attempt >= retries) {
                        throw err;
                    }
                    await new Promise((resolve) => setTimeout(resolve, 350 * (attempt + 1)));
                }
            }

            throw lastError || new Error('Network request failed');
        }

        // Audio player events
        audioPlayer.onended = () => {
            isSpeaking = false;
            if (isActive) {
                // Auto-start listening after bot finishes speaking
                setTimeout(() => startListening(), 300);
            } else {
                setIdleState();
            }
        };

        audioPlayer.onerror = () => {
            isSpeaking = false;
            if (isActive) {
                setTimeout(() => startListening(), 300);
            }
        };

        function handleOrbClick() {
            if (!isActive) {
                startConversation();
            }
        }

        function toggleConversation() {
            if (isActive) {
                stopConversation();
            } else {
                startConversation();
            }
        }

        async function startConversation() {
            try {
                // Request mic permission first
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

                isActive = true;
                toggleBtn.textContent = 'End Call';

                // Reset and show session stats
                turnCount = 0;
                sessionStartTime = Date.now();
                langCounts.hi = 0;
                langCounts.en = 0;
                updateStats();
                document.getElementById('sessionStats').style.display = 'flex';
                statsTimer = setInterval(updateStats, 1000);

                setProcessingState();
                status.textContent = 'Starting conversation...';

                // Fetch greeting from business API; fall back to default
                let greeting = 'Namaste! Main aapki kaise madad kar sakti hoon?';
                try {
                    const r = await fetch(`/api/business/${businessId}`);
                    if (r.ok) {
                        const biz = await r.json();
                        if (biz.greeting_text) greeting = biz.greeting_text;
                        if (biz.name) document.getElementById('businessTitle').textContent = biz.name;
                    }
                } catch (_) { /* use default */ }

                addMessage('bot', greeting);
                const audioUrl = await generateTTS(greeting);
                if (audioUrl) {
                    playSpeech(audioUrl);
                } else {
                    startListening();
                }

            } catch (err) {
                console.error('Mic error:', err);
                status.textContent = getMicErrorDetails(err);
                status.className = 'status-text error';
            }
        }

        async function stopConversation() {
            if (!isActive) return;
            isActive = false;

            if (statsTimer) {
                clearInterval(statsTimer);
                statsTimer = null;
            }

            stopListening();
            audioPlayer.pause();
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
            }
            setIdleState();
            toggleBtn.textContent = 'Start Call';
            status.textContent = 'Saving call log...';

            // End session on server to persist call log and trigger analysis
            const sid = sessionId;
            try {
                const response = await fetch('/api/voice/end-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sid }),
                });
                const data = await response.json();
                if (data.call_log_id) {
                    status.textContent = `Call saved. ID: ${data.call_log_id.slice(0, 8)}...`;
                    console.log('Call log created:', data);
                } else {
                    status.textContent = 'Call ended. Click to restart.';
                }
            } catch (err) {
                console.error('Failed to save call log:', err);
                status.textContent = 'Call ended. Click to restart.';
            }
        }

        async function resetConversation() {
            await stopConversation();
            // Bug fix: fresh UUID on reset, not timestamp
            sessionId = crypto.randomUUID();
            currentRequestId = 0;
            turnCount = 0;
            langCounts.hi = 0;
            langCounts.en = 0;
            chat.innerHTML = '';
            document.getElementById('sessionStats').style.display = 'none';
            status.textContent = 'Click to start conversation';
        }

        // States
        function setIdleState() {
            orb.className = 'orb idle';
            orbText.innerHTML = 'Click to<br>Start';
            volumeBars.style.display = 'none';
        }

        function setListeningState() {
            orb.className = 'orb listening';
            orbText.innerHTML = 'Listening...';
            volumeBars.style.display = 'flex';
            status.textContent = 'Speak now...';
            status.className = 'status-text active';
        }

        function setProcessingState() {
            orb.className = 'orb processing';
            orbText.innerHTML = 'Processing...';
            volumeBars.style.display = 'none';
            status.textContent = 'Processing...';
            status.className = 'status-text';
        }

        function setSpeakingState() {
            orb.className = 'orb speaking';
            orbText.innerHTML = 'Speaking...';
            volumeBars.style.display = 'none';
            status.textContent = 'Bot is speaking (Cartesia Sonic)...';
            status.className = 'status-text';
        }

        // Listening
        async function startListening() {
            if (isListening || !isActive) return;

            try {
                // Reuse existing stream or get new one
                if (!mediaStream || mediaStream.getTracks()[0].readyState === 'ended') {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                }

                audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(mediaStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'audio/webm' });
                audioChunks = [];
                hasSpoken = false;

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    if (audioContext) audioContext.close();

                    if (audioChunks.length > 0 && hasSpoken) {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        await processAudio(blob);
                    } else if (isActive) {
                        // No speech detected, keep listening
                        startListening();
                    }
                };

                mediaRecorder.start(100);
                isListening = true;
                setListeningState();
                monitorVolume();

            } catch (err) {
                console.error('Listen error:', err);
                status.textContent = getMicErrorDetails(err);
                status.className = 'status-text error';
            }
        }

        function stopListening() {
            if (!isListening) return;

            isListening = false;
            if (silenceTimer) {
                clearTimeout(silenceTimer);
                silenceTimer = null;
            }

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        function monitorVolume() {
            if (!isListening || !analyser) return;

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            const startTime = Date.now();

            function check() {
                if (!isListening) return;

                analyser.getByteFrequencyData(dataArray);

                // Calculate volume
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                const volume = sum / dataArray.length / 255;

                // Update volume bars
                updateVolumeBars(volume);

                // Detect speech
                if (volume > SILENCE_THRESHOLD) {
                    hasSpoken = true;
                    orbText.innerHTML = 'Speaking...';

                    if (silenceTimer) {
                        clearTimeout(silenceTimer);
                        silenceTimer = null;
                    }
                } else if (hasSpoken && !silenceTimer) {
                    // User stopped speaking, start silence timer
                    const elapsed = Date.now() - startTime;
                    if (elapsed > MIN_SPEECH_TIME) {
                        silenceTimer = setTimeout(() => {
                            stopListening();
                        }, SILENCE_DURATION);
                    }
                }

                // Max recording time: 30 seconds
                if (Date.now() - startTime > 30000) {
                    stopListening();
                    return;
                }

                requestAnimationFrame(check);
            }

            check();
        }

        function updateVolumeBars(volume) {
            const scaled = Math.min(volume * 4, 1);
            bars.forEach((bar, i) => {
                const height = 5 + (scaled * 25 * (1 + Math.sin(Date.now() / 100 + i)));
                bar.style.height = height + 'px';
            });
        }

        // Process audio — with monotonic request ID to discard stale responses
        async function processAudio(blob) {
            const myId = ++currentRequestId;
            isProcessing = true;
            setProcessingState();

            try {
                const formData = new FormData();
                formData.append('audio', blob, 'recording.webm');
                formData.append('session_id', sessionId);
                formData.append('response_mode', responseModeSelect.value || 'echo');
                formData.append('business_id', businessId);

                const data = await fetchJsonWithRetry('/api/voice/process', {
                    method: 'POST',
                    body: formData
                });

                // Stale response guard — a newer request is in flight, discard this one
                if (myId !== currentRequestId) return;

                // STT failure: show specific error instead of generic "couldn't understand"
                if (data.error === 'stt_failed') {
                    status.textContent = 'Connection error — retrying...';
                    status.className = 'status-text error';
                    if (isActive) setTimeout(() => startListening(), 1500);
                    return;
                }

                if (data.transcript) {
                    addMessage('user', data.transcript, data.detected_language);
                    // Track language for session stats
                    if (data.detected_language === 'hi') langCounts.hi++;
                    else if (data.detected_language === 'en') langCounts.en++;
                    turnCount++;
                    updateStats();
                }

                if (data.response) {
                    const msgEl = addMessage('bot', data.response);
                    addMetricsRow(msgEl, data);

                    if (data.audio_url) {
                        playSpeech(data.audio_url);
                    } else if (isActive) {
                        startListening();
                    }
                } else if (data.error) {
                    status.textContent = data.error;
                    status.className = 'status-text error';
                    if (isActive) setTimeout(() => startListening(), 1000);
                } else {
                    if (isActive) startListening();
                }

            } catch (err) {
                if (myId !== currentRequestId) return;
                console.error('Process error:', err);
                status.textContent = `Error: ${err?.message || err}`;
                status.className = 'status-text error';
                if (isActive) setTimeout(() => startListening(), 1000);
            } finally {
                if (myId === currentRequestId) isProcessing = false;
            }
        }

        // TTS
        async function generateTTS(text) {
            try {
                const data = await fetchJsonWithRetry('/api/voice/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                return data.audio_url;
            } catch (err) {
                console.error('TTS error:', err);
                return null;
            }
        }

        function playSpeech(url) {
            isSpeaking = true;
            setSpeakingState();
            audioPlayer.src = url;
            audioPlayer.play().catch(err => {
                console.error('Play error:', err);
                isSpeaking = false;
                if (isActive) startListening();
            });
        }

        // Messages — returns the created div element
        function addMessage(role, text, lang) {
            const div = document.createElement('div');
            div.className = `message ${role}`;

            let contentHtml = escapeHtml(text);
            if (role === 'user' && lang) {
                const badge = lang.toUpperCase();
                contentHtml = `<span class="lang-badge">${badge}</span>${contentHtml}`;
            }

            div.innerHTML = `
                <div class="message-content">${contentHtml}</div>
                <div class="message-meta">${new Date().toLocaleTimeString()}</div>
            `;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        // Append per-turn latency metrics below a message element
        function addMetricsRow(msgEl, data) {
            const parts = [];
            if (data.stt_latency_ms != null) parts.push(`STT ${Math.round(data.stt_latency_ms)}ms`);
            if (data.llm_first_token_ms != null) parts.push(`LLM ${Math.round(data.llm_first_token_ms)}ms`);
            if (data.tts_first_chunk_ms != null) parts.push(`TTS ${Math.round(data.tts_first_chunk_ms)}ms`);
            if (data.total_ms != null) parts.push(`Total ${Math.round(data.total_ms)}ms`);
            if (data.stt_confidence != null) {
                const pct = Math.round(data.stt_confidence * 100);
                const lang = data.detected_language ? ` ${data.detected_language.toUpperCase()}` : '';
                parts.push(`${pct}%${lang}`);
            }

            if (parts.length === 0) return;

            const row = document.createElement('div');
            row.className = 'metrics-row';
            row.textContent = parts.join('  •  ');
            msgEl.appendChild(row);
            chat.scrollTop = chat.scrollHeight;
        }

        // Update the session stats bar
        function updateStats() {
            if (!sessionStartTime) return;

            const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            const timeStr = `${mins}:${secs.toString().padStart(2, '0')}`;

            const totalLang = langCounts.hi + langCounts.en;
            let dominantLang = '—';
            if (totalLang > 0) {
                dominantLang = langCounts.hi >= langCounts.en ? 'HI' : 'EN';
            }

            const n = turnCount;
            document.getElementById('statTurns').textContent = `Turn ${n}`;
            document.getElementById('statTime').textContent = timeStr;
            document.getElementById('statLang').textContent = dominantLang;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
